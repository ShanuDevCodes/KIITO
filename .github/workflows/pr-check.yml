name: PR Check (fast signal)

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build + Test + Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore private portal sources
        env:
          SAP_SENSITIVE_FILES: ${{ secrets.SAP_SENSITIVE_FILES }}
          KAYA_SENSITIVE_FILES: ${{ secrets.KAYA_SENSITIVE_FILES }}
        run: |
          restore() {
            [ -z "$1" ] && return
            mkdir -p "$2"
            printf '%s' "$1" | base64 -d | tar xz --strip-components=1 -C "$2"
          }
          restore "$SAP_SENSITIVE_FILES" "composeApp/src/commonMain/kotlin/com/kito/sap/sensitive"
          restore "$KAYA_SENSITIVE_FILES" "composeApp/src/commonMain/kotlin/com/kito/kaya/sensitive"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build (Android + compile check)
        run: ./gradlew :composeApp:compileAndroidMain :androidApp:compileDebugKotlin --console=plain

      - name: Run commonTest (desktop JVM — fast)
        run: ./gradlew :composeApp:desktopTest --console=plain

      - name: Coverage verify
        run: ./gradlew :androidApp:koverVerify --console=plain

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: androidApp/build/reports/kover/html/
